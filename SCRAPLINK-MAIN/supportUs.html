<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScrapLink - Support Us</title>
</head>
<body style="margin:0; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:#f5f5f5;">

<!-- Navbar -->
<nav style="position:fixed; top:0; left:0; right:0; height:60px; background:#fff; border-bottom:1px solid #ddd; display:flex; align-items:center; padding:0 20px; z-index:1000;">
  <div style="display:flex; align-items:center; gap:10px;">
    <img src="images/menu.png" alt="menu" style="width:30px; height:30px; cursor:pointer;">
    <span style="color:#0E8F5B; font-weight:bold; font-size:20px;">ScrapLink</span>
  </div>
</nav>

<!-- Hero Section -->
<section style="margin-top:60px; background: linear-gradient(135deg,#0E8F5B,#0A6D46); color:white; padding:60px 20px; text-align:center;">
  <h1 style="font-size:32px; font-weight:bold; margin-bottom:20px;">Support ScrapLink</h1>
  <p style="font-size:16px; max-width:600px; margin:0 auto 30px auto;">
    Help us make recycling easier and more rewarding. Support us by donating or sending us feedback.
  </p>
</section>

<!-- Donation Buttons -->
<section style="padding:40px 20px; text-align:center;">
  <h2 style="font-size:24px; font-weight:bold; margin-bottom:20px;">Donate</h2>
  <div style="display:flex; justify-content:center; gap:20px; flex-wrap:wrap;">
    <button style="padding:14px 30px; border:none; border-radius:12px; background:#0E8F5B; color:white; font-weight:bold; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,0.2); transition:all 0.3s;" onclick="alert('Donate via Card')">Donate via Card</button>
    <button style="padding:14px 30px; border:none; border-radius:12px; background:#0A6D46; color:white; font-weight:bold; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,0.2); transition:all 0.3s;" onclick="alert('Donate via Mobile')">Donate via Mobile</button>
  </div>
</section>

<!-- Contact / Feedback Form -->
<section style="padding:40px 20px; background:#fff; border-radius:16px; max-width:700px; margin:40px auto;">
  <h2 style="font-size:24px; font-weight:bold; margin-bottom:20px; text-align:center;">Send Us Feedback</h2>
  <form style="display:flex; flex-direction:column; gap:15px;">
    <input type="text" name="name" placeholder="Your Name" required
           style="padding:12px 15px; border-radius:12px; border:1px solid #ddd; font-size:14px;">
    <input type="email" name="email" placeholder="Your Email" required
           style="padding:12px 15px; border-radius:12px; border:1px solid #ddd; font-size:14px;">
    <textarea name="message" placeholder="Your Message" rows="5" required
              style="padding:12px 15px; border-radius:12px; border:1px solid #ddd; font-size:14px;"></textarea>
    <button type="submit"
            style="padding:14px; border:none; border-radius:12px; background:#0E8F5B; color:white; font-weight:bold; cursor:pointer; transition:all 0.3s; box-shadow:0 2px 8px rgba(0,0,0,0.2);">
      Send Message
    </button>
  </form>
</section>

<!-- Footer -->
<footer style="background:#0A6D46; color:white; text-align:center; padding:20px; font-size:12px;">
  © 2025 ScrapLink. Turning Waste Into Wealth.
</footer>

</body>
</html>
